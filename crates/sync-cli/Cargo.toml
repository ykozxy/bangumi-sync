[package]
name = "sync-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sync_cli"
path = "src/lib.rs"

[[bin]]
name = "sync-v2"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.145"
sync-core = { path = "../sync-core" }
ureq = "2.12"

[dev-dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
